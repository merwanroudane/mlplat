[project]
name = "machine-learning-interactive-academy"
version = "1.1.0"
description = "An interactive Arabic Machine Learning and Double Machine Learning course built with Streamlit (أكاديمية تعلّم الآلة التفاعلية)."
readme = "README.md"
authors = [{ name = "Dr. Marwan Roudane" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.64,<2",
    "scikit-learn>=1.9.1,<1.10",
    "numpy>=2.2,<3",
    "scipy>=1.13,<2",
    "pandas>=2.2,<4",
    "statsmodels>=0.14,<0.16",
    "plotly>=6.5,<8",
]

[project.optional-dependencies]
boosting = ["xgboost>=3.2,<4", "lightgbm>=4.7,<5", "catboost>=1.2.10,<1.3"]
tuning = ["optuna>=5.0,<6"]
interpret = ["shap>=0.51,<0.53"]
imbalanced = ["imbalanced-learn>=0.14.2,<0.15"]
causal = ["DoubleML>=0.11.4,<0.12", "econml>=0.17,<0.18"]
all = ["machine-learning-interactive-academy[boosting,tuning,interpret,imbalanced,causal]"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F", "B006", "B008"]
ignore = ["E402"]
